name: Production Maintenance

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-https:
    name: Check public HTTPS and TLS
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify public health and certificate validity
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 https://wangjinkun333.me/api/health >/dev/null
          timeout 20s openssl s_client -connect wangjinkun333.me:443 -servername wangjinkun333.me \
            -verify_return_error </dev/null 2>/dev/null |
            openssl x509 -checkend 1814400 -noout

  maintenance:
    name: Check Aliyun production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Run maintenance via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.PROJECT_PATH }}"
            export PROJECT_DIR="$PWD"
            export BACKUP_DIR="$(dirname "$PWD")/backups/first_myself_site"
            ./scripts/production-maintenance.sh

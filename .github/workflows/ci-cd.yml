name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 第1层：代码规范检查 ──────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  # ── 第2层：TypeScript 类型检查（依赖 lint 通过）──
  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.ci.json

  # ── 第2层并行：PR 依赖变更审查 ──────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  # ── 第3层：自动化测试 ─────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: type-check
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: blog_agent_test
          POSTGRES_USER: blog_agent_test
          POSTGRES_PASSWORD: blog_agent_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog_agent_test -d blog_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: Verify Blog Agent migration, cache, and quotas
        run: >-
          npx vitest run
          __tests__/payload/blog-agent-migration.postgres.test.ts
          __tests__/payload/blog-agent-article-package-migration.postgres.test.ts
          __tests__/payload/agent-question-log-migration.postgres.test.ts
          __tests__/payload/owner-analytics-identity-migration.postgres.test.ts
          __tests__/payload/blog-series-migration.postgres.test.ts
          __tests__/lib/blog-agent/articleIndexRepository.postgres.test.ts
          __tests__/lib/blog-agent/runtime.postgres.test.ts
          __tests__/scripts/blog-agent-canary.postgres.test.ts
        env:
          BLOG_AGENT_TEST_DATABASE_URL: postgresql://blog_agent_test:blog_agent_test_password@127.0.0.1:5432/blog_agent_test
          MIGRATION_TEST_DATABASE_URL: postgresql://blog_agent_test:blog_agent_test_password@127.0.0.1:5432/blog_agent_test
          MIGRATION_TEST_BOOTSTRAP: '1'

  # ── 第4层：构建检查 ───────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          PAYLOAD_SECRET: ci-placeholder-secret-32-chars-long
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          BLOG_AGENT_ENABLED: false
          BLOG_AGENT_GENERATION_ENABLED: false

  # ── CD：自动部署（仅 main 分支） ──────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    # 依赖变更已在 PR 上审查；main 部署不再重复请求外部 npm audit 服务。
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout deploy source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check latest main commit
        id: latest-main
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded commit $GITHUB_SHA; latest main is $latest_sha"
          fi
      - name: Set up Docker Buildx exporter
        if: steps.latest-main.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Create verified deployment payload
        if: steps.latest-main.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          git bundle create deploy-source.bundle HEAD
          git bundle verify deploy-source.bundle
          docker buildx build \
            --platform=linux/amd64 \
            --tag first_myself_site:candidate \
            --build-arg NEXT_PUBLIC_SERVER_URL=https://wangjinkun333.me \
            --output type=docker,dest=first_myself_site-candidate.tar \
            --file docker/Dockerfile \
            .
          gzip -1 first_myself_site-candidate.tar
          sha256sum first_myself_site-candidate.tar.gz > first_myself_site-candidate.tar.gz.sha256
          gzip -t first_myself_site-candidate.tar.gz
          sha256sum --check first_myself_site-candidate.tar.gz.sha256
      - name: Upload deployment payload
        if: steps.latest-main.outputs.deploy == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy-source.bundle,first_myself_site-candidate.tar.gz,first_myself_site-candidate.tar.gz.sha256
          target: /tmp/first_myself_site_deploy_${{ github.run_id }}
          overwrite: true
          command_timeout: 30m
      - name: Deploy via SSH
        if: steps.latest-main.outputs.deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          BLOG_AGENT_API_KEY: ${{ secrets.BLOG_AGENT_API_KEY }}
          BLOG_AGENT_ENABLED: ${{ vars.BLOG_AGENT_ENABLED }}
          BLOG_AGENT_GENERATION_ENABLED: ${{ vars.BLOG_AGENT_GENERATION_ENABLED }}
          BLOG_AGENT_BASE_URL: ${{ vars.BLOG_AGENT_BASE_URL }}
          BLOG_AGENT_MODEL: ${{ vars.BLOG_AGENT_MODEL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          BLOG_AGENT_EMBEDDING_BASE_URL: ${{ vars.BLOG_AGENT_EMBEDDING_BASE_URL }}
          BLOG_AGENT_EMBEDDING_MODEL: ${{ vars.BLOG_AGENT_EMBEDDING_MODEL }}
          BLOG_AGENT_EMBEDDING_DIMENSIONS: ${{ vars.BLOG_AGENT_EMBEDDING_DIMENSIONS }}
          BLOG_AGENT_EMBEDDING_TIMEOUT_MS: ${{ vars.BLOG_AGENT_EMBEDDING_TIMEOUT_MS }}
          BLOG_AGENT_CANARY_SLUG: ${{ vars.BLOG_AGENT_CANARY_SLUG }}
          BLOG_AGENT_CANARY_QUESTION: ${{ vars.BLOG_AGENT_CANARY_QUESTION }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BLOG_AGENT_API_KEY,BLOG_AGENT_ENABLED,BLOG_AGENT_GENERATION_ENABLED,BLOG_AGENT_BASE_URL,BLOG_AGENT_MODEL,DASHSCOPE_API_KEY,BLOG_AGENT_EMBEDDING_BASE_URL,BLOG_AGENT_EMBEDDING_MODEL,BLOG_AGENT_EMBEDDING_DIMENSIONS,BLOG_AGENT_EMBEDDING_TIMEOUT_MS,BLOG_AGENT_CANARY_SLUG,BLOG_AGENT_CANARY_QUESTION
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.PROJECT_PATH }}"

            bundle_directory="/tmp/first_myself_site_deploy_${{ github.run_id }}"
            bundle_path="$bundle_directory/deploy-source.bundle"
            candidate_image_archive="$bundle_directory/first_myself_site-candidate.tar.gz"
            candidate_image_checksum="$bundle_directory/first_myself_site-candidate.tar.gz.sha256"
            cleanup_deploy_bundle() {
              rm -f "$bundle_path" "$candidate_image_archive" "$candidate_image_checksum"
              rmdir "$bundle_directory" 2>/dev/null || true
            }
            trap cleanup_deploy_bundle EXIT
            for artifact in "$bundle_path" "$candidate_image_archive" "$candidate_image_checksum"; do
              if [ ! -f "$artifact" ]; then
                echo "Uploaded deploy artifact is missing: $artifact" >&2
                exit 1
              fi
            done
            (
              cd "$bundle_directory"
              sha256sum --check "$(basename "$candidate_image_checksum")"
            )
            gzip -t "$candidate_image_archive"
            gzip -dc "$candidate_image_archive" | docker load
            docker image inspect first_myself_site:candidate >/dev/null

            export BLOG_AGENT_ENABLED="${BLOG_AGENT_ENABLED:-false}"
            export BLOG_AGENT_GENERATION_ENABLED="${BLOG_AGENT_GENERATION_ENABLED:-false}"
            if [ "$BLOG_AGENT_ENABLED" != "true" ] && [ "$BLOG_AGENT_ENABLED" != "false" ]; then
              echo "BLOG_AGENT_ENABLED must be true or false" >&2
              exit 1
            fi
            if [ "$BLOG_AGENT_GENERATION_ENABLED" != "true" ] && [ "$BLOG_AGENT_GENERATION_ENABLED" != "false" ]; then
              echo "BLOG_AGENT_GENERATION_ENABLED must be true or false" >&2
              exit 1
            fi
            if [ "$BLOG_AGENT_ENABLED" = "true" ] || [ "$BLOG_AGENT_GENERATION_ENABLED" = "true" ]; then
              if [ -z "${BLOG_AGENT_API_KEY:-}" ] || \
                 [ -z "${BLOG_AGENT_BASE_URL:-}" ] || \
                 [ -z "${BLOG_AGENT_MODEL:-}" ] || \
                 [ -z "${DASHSCOPE_API_KEY:-}" ] || \
                 [ -z "${BLOG_AGENT_EMBEDDING_BASE_URL:-}" ] || \
                 [ -z "${BLOG_AGENT_EMBEDDING_MODEL:-}" ] || \
                 [ -z "${BLOG_AGENT_EMBEDDING_DIMENSIONS:-}" ] || \
                 [ -z "${BLOG_AGENT_EMBEDDING_TIMEOUT_MS:-}" ]; then
                echo "Blog Agent provider configuration is incomplete in GitHub" >&2
                exit 1
              fi
              if [ "$BLOG_AGENT_EMBEDDING_DIMENSIONS" != "1024" ]; then
                echo "BLOG_AGENT_EMBEDDING_DIMENSIONS must be 1024" >&2
                exit 1
              fi
              if [ -z "${BLOG_AGENT_CANARY_SLUG:-}" ] || [ -z "${BLOG_AGENT_CANARY_QUESTION:-}" ]; then
                echo "Blog Agent production canary configuration is incomplete in GitHub" >&2
                exit 1
              fi
            fi

            target_blog_agent_enabled="$BLOG_AGENT_ENABLED"
            target_blog_agent_generation_enabled="$BLOG_AGENT_GENERATION_ENABLED"
            # 候选版本通过内部 canary 前不得向匿名访客开放 Agent。
            export BLOG_AGENT_ENABLED=false
            export BLOG_AGENT_GENERATION_ENABLED=false

            compose=(docker compose --env-file .env.docker.prod -f docker/docker-compose.prod.yml)
            previous_image="$(docker inspect --format='{{.Image}}' first_myself_site_prod 2>/dev/null || true)"
            if [ -n "$previous_image" ]; then
              docker tag "$previous_image" first_myself_site:rollback
            fi

            wait_for_local_health() {
              for attempt in $(seq 1 24); do
                if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/api/health >/dev/null; then
                  return 0
                fi
                sleep 5
              done
              return 1
            }

            verify_nginx_health() {
              curl --fail --silent --show-error --max-time 10 \
                --noproxy '*' \
                --resolve "wangjinkun333.me:443:127.0.0.1" \
                https://wangjinkun333.me/api/health >/dev/null
            }

            verify_agent_disabled() {
              status="$(curl --silent --show-error --max-time 5 \
                --output /dev/null --write-out '%{http_code}' \
                --header 'Content-Type: application/json' \
                --data '{"question":"deployment safety probe"}' \
                "http://127.0.0.1:3000/api/blog/$BLOG_AGENT_CANARY_SLUG/agent")"
              [ "$status" = "404" ]
            }

            verify_runtime_agent_flags() {
              "${compose[@]}" exec -T app node -e \
                'process.exit(process.env.BLOG_AGENT_ENABLED === process.argv[1] && process.env.BLOG_AGENT_GENERATION_ENABLED === process.argv[2] ? 0 : 1)' \
                "$target_blog_agent_enabled" \
                "$target_blog_agent_generation_enabled"
            }

            rollback() {
              if [ -z "$previous_image" ]; then
                echo "No previous application image is available for rollback" >&2
                return 1
              fi

              echo "Restoring previous application image"
              if ! docker tag first_myself_site:rollback first_myself_site:candidate; then
                return 1
              fi
              if ! "${compose[@]}" up -d --no-deps --force-recreate app; then
                return 1
              fi
              if ! wait_for_local_health || ! verify_agent_disabled; then
                echo "Rollback did not reach a healthy disabled-Agent state" >&2
                "${compose[@]}" logs --tail=100 app >&2
                return 1
              fi
              echo "Rollback health and disabled-Agent checks passed"
              return 0
            }

            fail_closed_rollback() {
              export BLOG_AGENT_ENABLED=false
              export BLOG_AGENT_GENERATION_ENABLED=false
              if rollback; then
                return 0
              fi
              echo "Rollback failed; stopping the application to keep Agent fail closed" >&2
              if docker stop first_myself_site_prod >/dev/null; then
                return 0
              fi
              echo "Failed to stop the application after rollback failure" >&2
              return 1
            }

            # 阿里云无法稳定访问 GitHub、镜像站和 npm；Actions 将已校验的源码与候选应用镜像推送到服务器。
            git fetch "$bundle_path" HEAD
            git checkout main
            git merge --ff-only FETCH_HEAD
            # 候选镜像已在 GitHub Runner 构建并校验；服务器不再执行任何依赖公网的构建步骤。
            docker image inspect first_myself_site:candidate >/dev/null
            # 发布工具会把大图优化到 400 KiB 以下；切换前确认线上实际媒体路径可接收该请求。
            bash scripts/verify-nginx-media-upload.sh
            # 切换前备份当前数据库与媒体；备份失败时 set -e 会终止部署。
            PROJECT_DIR="$PWD" \
              BACKUP_DIR="$(dirname "$PWD")/backups/first_myself_site" \
              ./scripts/backup.sh
            # 清理旧 production pushDevSchema 留下的标记，否则 Payload 会等待交互确认。
            "${compose[@]}" exec -T postgres sh -c \
              'psql --set ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB"' <<'SQL'
            DO $migration_marker_cleanup$
            DECLARE
              removed_count integer := 0;
            BEGIN
              IF to_regclass('payload_migrations') IS NOT NULL THEN
                DELETE FROM "payload_migrations"
                  WHERE "batch" = -1 AND "name" = 'dev';
                GET DIAGNOSTICS removed_count = ROW_COUNT;
              END IF;
              RAISE NOTICE 'Removed % legacy dev migration marker(s)', removed_count;
            END
            $migration_marker_cleanup$;
            SQL
            # 使用刚构建的 candidate image 执行显式 production migration；失败时旧容器继续服务。
            "${compose[@]}" run --rm --no-deps app npm run payload -- migrate
            # build 完成后再切换（停机时间 < 10秒）
            if ! "${compose[@]}" up -d; then
              if ! fail_closed_rollback; then
                echo "Unable to establish a fail-closed rollback state" >&2
              fi
              exit 1
            fi

            if ! wait_for_local_health || ! verify_agent_disabled; then
              "${compose[@]}" ps
              "${compose[@]}" logs --tail=100 app
              if ! fail_closed_rollback; then
                echo "Unable to establish a fail-closed rollback state" >&2
              fi
              exit 1
            fi

            # 直连本机 Nginx，验证域名、SNI、证书与代理链路，避免外层安全策略误伤发布探针。
            if ! verify_nginx_health; then
              if ! fail_closed_rollback; then
                echo "Unable to establish a fail-closed rollback state" >&2
              fi
              exit 1
            fi

            if [ "$target_blog_agent_generation_enabled" = "true" ]; then
              if ! "${compose[@]}" exec -T app npm run blog-agent:canary -- \
                "--slug=$BLOG_AGENT_CANARY_SLUG" \
                "--question=$BLOG_AGENT_CANARY_QUESTION" \
                --require-package \
                --require-code; then
                if ! fail_closed_rollback; then
                  echo "Unable to establish a fail-closed rollback state" >&2
                fi
                exit 1
              fi
            fi

            export BLOG_AGENT_ENABLED="$target_blog_agent_enabled"
            export BLOG_AGENT_GENERATION_ENABLED="$target_blog_agent_generation_enabled"
            if ! "${compose[@]}" up -d --no-deps --force-recreate app; then
              if ! fail_closed_rollback; then
                echo "Unable to establish a fail-closed rollback state" >&2
              fi
              exit 1
            fi
            if ! wait_for_local_health || ! verify_runtime_agent_flags; then
              "${compose[@]}" logs --tail=100 app
              if ! fail_closed_rollback; then
                echo "Unable to establish a fail-closed rollback state" >&2
              fi
              exit 1
            fi
            if ! verify_nginx_health; then
              if ! fail_closed_rollback; then
                echo "Unable to establish a fail-closed rollback state" >&2
              fi
              exit 1
            fi

            "${compose[@]}" ps
            unset BLOG_AGENT_API_KEY BLOG_AGENT_ENABLED BLOG_AGENT_GENERATION_ENABLED
            unset BLOG_AGENT_BASE_URL BLOG_AGENT_MODEL DASHSCOPE_API_KEY
            unset BLOG_AGENT_EMBEDDING_BASE_URL BLOG_AGENT_EMBEDDING_MODEL
            unset BLOG_AGENT_EMBEDDING_DIMENSIONS BLOG_AGENT_EMBEDDING_TIMEOUT_MS
            unset BLOG_AGENT_CANARY_SLUG BLOG_AGENT_CANARY_QUESTION
            # 清理悬空镜像，释放磁盘空间
            docker image prune -f
            echo "✅ 部署完成"

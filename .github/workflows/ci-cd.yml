name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 第1层：代码规范检查 ──────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  # ── 第2层：TypeScript 类型检查（依赖 lint 通过）──
  type-check:
    name: TypeScript
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.ci.json

  # ── 第2层并行：依赖安全扫描 ──────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high

  # ── 第3层：自动化测试 ─────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: type-check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # ── 第4层：构建检查 ───────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          PAYLOAD_SECRET: ci-placeholder-secret-32-chars-long
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

  # ── CD：自动部署（仅 main 分支） ──────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.PROJECT_PATH }}"

            compose=(docker compose --env-file .env.docker.prod -f docker/docker-compose.prod.yml)
            previous_image="$(docker inspect --format='{{.Image}}' first_myself_site_prod 2>/dev/null || true)"
            if [ -n "$previous_image" ]; then
              docker tag "$previous_image" first_myself_site:rollback
            fi

            rollback() {
              if [ -z "$previous_image" ]; then
                echo "No previous application image is available for rollback" >&2
                return 1
              fi

              echo "Restoring previous application image"
              docker tag first_myself_site:rollback first_myself_site:candidate
              "${compose[@]}" up -d --no-deps --force-recreate app

              for attempt in $(seq 1 24); do
                if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/api/health >/dev/null; then
                  echo "Rollback health check passed"
                  return 0
                fi
                sleep 5
              done

              echo "Rollback health check failed" >&2
              "${compose[@]}" logs --tail=100 app >&2
              return 1
            }

            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            # 先 build（旧容器仍在运行，用户无感知）
            "${compose[@]}" build app
            # 发布工具会把大图优化到 400 KiB 以下；切换前确认线上实际媒体路径可接收该请求。
            bash scripts/verify-nginx-media-upload.sh
            # 切换前备份当前数据库与媒体；备份失败时 set -e 会终止部署。
            PROJECT_DIR="$PWD" \
              BACKUP_DIR="$(dirname "$PWD")/backups/first_myself_site" \
              ./scripts/backup.sh
            # 清理旧 production pushDevSchema 留下的标记，否则 Payload 会等待交互确认。
            "${compose[@]}" exec -T postgres sh -c \
              'psql --set ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB"' <<'SQL'
            DO $migration_marker_cleanup$
            DECLARE
              removed_count integer := 0;
            BEGIN
              IF to_regclass('payload_migrations') IS NOT NULL THEN
                DELETE FROM "payload_migrations"
                  WHERE "batch" = -1 AND "name" = 'dev';
                GET DIAGNOSTICS removed_count = ROW_COUNT;
              END IF;
              RAISE NOTICE 'Removed % legacy dev migration marker(s)', removed_count;
            END
            $migration_marker_cleanup$;
            SQL
            # build 完成后再切换（停机时间 < 10秒）
            if ! "${compose[@]}" up -d; then
              rollback || true
              exit 1
            fi

            ready=0
            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/api/health >/dev/null; then
                ready=1
                break
              fi
              sleep 5
            done

            if [ "$ready" -ne 1 ]; then
              "${compose[@]}" ps
              "${compose[@]}" logs --tail=100 app
              rollback || true
              exit 1
            fi

            # 同时验证 Nginx、域名和 TLS，避免只检查到容器内部正常。
            if ! curl --fail --silent --show-error --max-time 10 \
              https://wangjinkun333.me/api/health >/dev/null; then
              rollback || true
              exit 1
            fi

            "${compose[@]}" ps
            # 清理悬空镜像，释放磁盘空间
            docker image prune -f
            echo "✅ 部署完成"
